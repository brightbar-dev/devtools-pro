<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightbar DevTools</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="dtp-popup">
    <header class="dtp-header">
      <h1>Brightbar DevTools</h1>
      <span class="dtp-header-note">Every tool free</span>
    </header>

    <div class="dtp-page-notice" id="page-notice" role="status" hidden></div>

    <section class="dtp-tools" id="tools-grid" aria-label="Tools">
      <!-- Tool buttons rendered by main.ts -->
    </section>
    <p class="dtp-tool-description" id="tool-description" aria-hidden="true"></p>

    <section class="dtp-meta-panel" id="meta-panel" style="display:none">
      <div class="dtp-meta-header">
        <button id="meta-back" class="dtp-back-btn" title="Back" aria-label="Back to tools">&larr;</button>
        <span id="meta-title">Page Meta</span>
      </div>
      <div id="meta-content" class="dtp-meta-content"></div>
    </section>

    <section class="dtp-cross-promo">
      <h2 class="dtp-cross-promo-heading">More from Brightbar</h2>
      <ul class="dtp-cross-promo-list">
        <li><a href="https://chromewebstore.google.com/detail/json-viewer-pro/iodhhjpjemdfmmfffmejfnbbjbfafoac" target="_blank" rel="noopener">Brightbar JSON Viewer <span class="dtp-cross-promo-desc">— Auto-format JSON with tree view</span></a></li>
        <li><a href="https://chromewebstore.google.com/detail/cookie-devtools/pgohmdladleifefhobididhhlmjcknjl" target="_blank" rel="noopener">Cookie DevTools <span class="dtp-cross-promo-desc">— Cookie manager with real-time monitoring</span></a></li>
        <li><a href="https://chromewebstore.google.com/detail/browser-api-client/gnfhfenegmjdjlfclcabfmajgaiaheij" target="_blank" rel="noopener">Browser API Client <span class="dtp-cross-promo-desc">— Lightweight API client in your browser</span></a></li>
      </ul>
    </section>

    <footer class="dtp-footer">
      <span class="dtp-version" id="version"></span>
      <a href="#" id="options-link" class="dtp-options-link">Settings</a>
    </footer>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
