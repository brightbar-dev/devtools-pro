<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="manifest.open_in_tab" content="true" />
  <title>Brightbar DevTools — Settings</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="dtp-options">
    <h1>Brightbar DevTools Settings</h1>

    <section class="dtp-section">
      <h2>Appearance</h2>
      <div class="dtp-field">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="auto">Auto (system)</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="dtp-field">
        <label>
          <input type="checkbox" id="compact-mode">
          Compact panel — smaller text, no paths or rule sources
        </label>
      </div>
    </section>

    <section class="dtp-section">
      <h2>Measure</h2>
      <div class="dtp-field">
        <label for="measure-unit">Length unit</label>
        <select id="measure-unit">
          <option value="px">Pixels (px)</option>
          <option value="rem">Root em (rem)</option>
          <option value="em">Element em (em)</option>
          <option value="pt">Points (pt)</option>
          <option value="cm">Centimetres (cm)</option>
          <option value="mm">Millimetres (mm)</option>
          <option value="in">Inches (in)</option>
        </select>
        <p class="dtp-hint">Used by the Measure tool. 96px = 1in = 2.54cm = 72pt; rem follows the page's root font size, em the measured element's. Press U in the tool to cycle.</p>
      </div>
    </section>

    <section class="dtp-section">
      <h2>About</h2>
      <p>Brightbar DevTools</p>
      <p>Every tool is free, with no limits.</p>
      <p>Built by <a href="https://brightbar.dev" target="_blank">Brightbar</a></p>
    </section>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
